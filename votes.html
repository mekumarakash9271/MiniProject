<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Votes List</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header"><i class="fa-solid fa-check-double"></i> VeriBallot Admin</div>
      <div class="user-profile">
        <img src="https://ui-avatars.com/api/?name=CRCE+Admin&background=4f46e5&color=fff" alt="User">
        <div class="user-info"><h4>VeriBallot Admin</h4><span class="status-online"><i class="fa-solid fa-circle"></i> Online</span></div>
      </div>
      <nav class="sidebar-menu">
        <div class="menu-label">REPORTS</div>
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="votes.html" class="nav-item active"><i class="fa-solid fa-check-to-slot"></i> Votes</a>
        <div class="menu-label">MANAGE</div>
        <a href="voters.html" class="nav-item"><i class="fa-solid fa-users"></i> Voters</a>
        <a href="positions.html" class="nav-item"><i class="fa-solid fa-sitemap"></i> Positions</a>
        <a href="candidates.html" class="nav-item"><i class="fa-solid fa-user-tie"></i> Candidates</a>
        <div class="menu-label">SETTINGS</div>
        <a href="ballot.html" class="nav-item"><i class="fa-solid fa-list-ol"></i> Ballot Position</a>
        <a href="admin_login.html" class="nav-item"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar"><span class="breadcrumb-title">Votes</span></header>
      <section class="view-section">
        <div class="card">
          <div class="card-header">
            <button class="btn btn-danger" onclick="resetVotes()"><i class="fa-solid fa-rotate-left"></i> Reset Votes</button>
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" placeholder="Search votes...">
            </div>
          </div>
          <div class="card-body">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Position</th>
                  <th>Candidate</th>
                  <th>Voter</th>
                </tr>
              </thead>
              <tbody id="votesTableBody">
                <tr>
                  <td colspan="3" style="text-align: center; color: var(--text-muted);">No data available in table</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="votes.js"></script>
</body>
</html>
