<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Voting System - Admin Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-logo">
        <i class="fa-solid fa-user-shield"></i>
        <span>VeriBallot Admin Portal</span>
      </div>
      <h2>Admin Sign In</h2>
      <p class="subtitle">Sign in to start your admin session</p>

      <form id="adminLoginForm">
        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Username</label>
          <input type="text" id="adminUsername" placeholder="Admin username" required>
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-key"></i> Password</label>
          <input type="password" id="adminPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>
    </div>
  </div>
  <script src="admin_login.js"></script>
</body>
</html>
