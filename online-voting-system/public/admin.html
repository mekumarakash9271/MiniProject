<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Voting Results</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007BFF; color: white; }
        .footer-link { text-align: center; margin-top: 20px; display: block; font-size: 14px; color: #007BFF; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Live Vote Tally</h2>
        <table>
            <thead>
                <tr>
                    <th>Candidate Name</th>
                    <th>Total Votes</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                <tr><td colspan="2" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>
        <a href="index.html" class="footer-link">Back to Voting Page</a>
    </div>

    <script>
        async function fetchResults() {
            try {
                const response = await fetch('/results');
                const data = await response.json();
                const tbody = document.getElementById('resultsBody');
                tbody.innerHTML = '';
                
                data.forEach(candidate => {
                    let row = `<tr><td>${candidate.name}</td><td>${candidate.votes}</td></tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error("Error fetching results:", err);
            }
        }

        fetchResults();
        setInterval(fetchResults, 3000);
    </script>
</body>
</html>
