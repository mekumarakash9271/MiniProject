<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Candidates List</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header"><i class="fa-solid fa-check-double"></i> VeriBallot Admin</div>
      <div class="user-profile">
        <img src="https://ui-avatars.com/api/?name=CRCE+Admin&background=4f46e5&color=fff" alt="User">
        <div class="user-info"><h4>VeriBallot Admin</h4><span class="status-online"><i class="fa-solid fa-circle"></i> Online</span></div>
      </div>
      <nav class="sidebar-menu">
        <div class="menu-label">REPORTS</div>
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="votes.html" class="nav-item"><i class="fa-solid fa-check-to-slot"></i> Votes</a>
        <div class="menu-label">MANAGE</div>
        <a href="voters.html" class="nav-item"><i class="fa-solid fa-users"></i> Voters</a>
        <a href="positions.html" class="nav-item"><i class="fa-solid fa-sitemap"></i> Positions</a>
        <a href="candidates.html" class="nav-item active"><i class="fa-solid fa-user-tie"></i> Candidates</a>
        <div class="menu-label">SETTINGS</div>
        <a href="ballot.html" class="nav-item"><i class="fa-solid fa-list-ol"></i> Ballot Position</a>
        <a href="admin_login.html" class="nav-item"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar"><span class="breadcrumb-title">Candidates List</span></header>
      <section class="view-section">
        <div class="card">
          <div class="card-header">
            <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Candidate</button>
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" placeholder="Search candidates...">
            </div>
          </div>
          <div class="card-body">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Position</th>
                  <th>Photo</th>
                  <th>Firstname</th>
                  <th>Lastname</th>
                  <th>Platform</th>
                  <th>Tools</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><span class="badge badge-purple">Class Coordinator</span></td>
                  <td><img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" class="avatar-sm"></td>
                  <td>Mickey</td>
                  <td>Mouse</td>
                  <td><button class="btn btn-sm btn-info" onclick="viewPlatform('Mickey Mouse')"><i class="fa-solid fa-eye"></i> View</button></td>
                  <td>
                    <button class="btn btn-sm btn-success"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
                  </td>
                </tr>
                <tr>
                  <td><span class="badge badge-purple">Class Coordinator</span></td>
                  <td><img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100" class="avatar-sm"></td>
                  <td>Tom</td>
                  <td>Cat</td>
                  <td><button class="btn btn-sm btn-info" onclick="viewPlatform('Tom Cat')"><i class="fa-solid fa-eye"></i> View</button></td>
                  <td>
                    <button class="btn btn-sm btn-success"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
                  </td>
                </tr>
                <tr>
                  <td><span class="badge badge-purple">Class Coordinator</span></td>
                  <td><img src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=100" class="avatar-sm"></td>
                  <td>Spiderman</td>
                  <td>Kumar</td>
                  <td><button class="btn btn-sm btn-info" onclick="viewPlatform('Spiderman Kumar')"><i class="fa-solid fa-eye"></i> View</button></td>
                  <td>
                    <button class="btn btn-sm btn-success"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="candidates.js"></script>
</body>
</html>
